name: Nifty 50 IRB Bot

on:
  schedule:
    # Runs every 2 minutes from 9:10 AM to 3:40 PM IST (03:40 to 10:10 UTC)
    # GitHub uses UTC time. IST is UTC + 5:30.
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pandas_ta numpy requests

      - name: Run Strategy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
